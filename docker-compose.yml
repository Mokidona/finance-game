name: budget-mini-app

services:
  backend:
    build:
      context: ./backend
    image: budget-mini-app-backend:latest
    restart: unless-stopped
    environment:
      DB_PATH: /data/budget.db
      TZ: ${TZ:-Asia/Almaty}
    volumes:
      - budget_data:/data
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
    image: budget-mini-app-frontend:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Almaty}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.2mln.rule=Host(`${DOMAIN:-localhost}`)"
      - "traefik.http.routers.2mln.entrypoints=websecure"
      - "traefik.http.routers.2mln.tls.certresolver=${CERTRESOLVER:-myresolver}"
      - "traefik.http.services.2mln.loadbalancer.server.port=80"

volumes:
  budget_data:

networks:
  internal:
    driver: bridge
  traefik-public:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik-public}

# Продакшн-отдача фронтенда: собранная статика Vite + прокси /api на бэкенд.
# `backend` — имя сервиса из docker-compose (внутри compose-сети это DNS-имя).
# Если переименуете сервис, поправьте и proxy_pass ниже.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Бандл ~440 KB (139 KB gzip) — сжатие заметно и на мобильной сети Telegram
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 4m;

    # API как есть: /api/v1/... → backend:8000/api/v1/... (без перезаписи пути)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Ассеты: и хешированные бандлы Vite, и спрайты маскота из public/assets.
    # 7 дней — компромисс: имя спрайта не хешируется, но менять его мы не планируем.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # SPA-роутинг: любой неизвестный путь отдаёт index.html, а не 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html не кешируем: иначе WebView Telegram залипнет на старой сборке
    # и не узнает о новом бандле после деплоя
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
